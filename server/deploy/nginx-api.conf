# /etc/nginx/sites-available/api.aden-art.com
# reverse proxy إلى الخدمة الداخلية 127.0.0.1:3010 فقط.
# بعد التشغيل: certbot --nginx -d api.aden-art.com يضيف كتلة 443 + الشهادة.

server {
    listen 80;
    listen [::]:80;
    server_name api.aden-art.com;

    # تحدّي Let's Encrypt (HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # حد حجم الجسم على مستوى nginx أيضاً (طبقة دفاع إضافية)
    client_max_body_size 4k;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}
